<!DOCTYPE html>
<html>
<head>
  <title>Results</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Enter Result</h1>
  <form method="POST">
    <label>Student ID: <input type="text" name="student" required></label>
    <label>Subject ID: <input type="text" name="subject" required></label>
    <label>CA: <input type="number" name="ca" required></label>
    <label>Exam: <input type="number" name="exam" required></label>
    <button type="submit">Save Result</button>
  </form>

  <h2>All Results</h2>
  <table>
    <tr><th>ID</th><th>Student</th><th>Subject</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th><th>Remark</th></tr>
    {% for r in results %}
    <tr>
      <td>{{r[0]}}</td><td>{{r[1]}}</td><td>{{r[2]}}</td>
      <td>{{r[3]}}</td><td>{{r[4]}}</td><td>{{r[5]}}</td>
      <td>{{r[6]}}</td><td>{{r[7]}}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
