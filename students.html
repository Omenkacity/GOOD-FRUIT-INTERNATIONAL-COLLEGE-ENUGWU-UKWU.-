<!DOCTYPE html>
<html>
<head>
  <title>Students</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Add Student</h1>
  <form method="POST">
    <input type="text" name="name" placeholder="Student Name" required>
    <select name="class">
      <option>JS1</option>
      <option>JS2</option>
      <option>JS3</option>
      <option>SS1</option>
      <option>SS2</option>
      <option>SS3</option>
    </select>
    <select name="gender">
      <option>Male</option>
      <option>Female</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <h2>All Students</h2>
  <table>
    <tr><th>ID</th><th>Name</th><th>Class</th><th>Gender</th></tr>
    {% for s in students %}
    <tr>
      <td>{{s[0]}}</td><td>{{s[1]}}</td><td>{{s[2]}}</td><td>{{s[3]}}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
