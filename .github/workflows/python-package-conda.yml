from flask import Flask, render_template_string, request
import sqlite3

app = Flask(__name__)

# ---------- Database Setup ----------
def init_db():
    conn = sqlite3.connect("school.db")
    c = conn.cursor()
    c.execute("""CREATE TABLE IF NOT EXISTS students(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT, class TEXT
    )""")
    c.execute("""CREATE TABLE IF NOT EXISTS subjects(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT
    )""")
    c.execute("""CREATE TABLE IF NOT EXISTS results(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        student_id INTEGER,
        subject_id INTEGER,
        ca INTEGER, exam INTEGER, total INTEGER,
        grade TEXT, remark TEXT,
        FOREIGN KEY(student_id) REFERENCES students(id),
        FOREIGN KEY(subject_id) REFERENCES subjects(id)
    )""")
    conn.commit()
    conn.close()

init_db()

# ---------- Grade Calculator ----------
def calculate_result(ca, exam):
    total = ca + exam
    if total >= 70: grade, remark = "A", "Excellent"
    elif total >= 60: grade, remark = "B", "Very Good"
    elif total >= 50: grade, remark = "C", "Good"
    elif total >= 45: grade, remark = "D", "Fair"
    elif total >= 40: grade, remark = "E", "Pass"
    else: grade, remark = "F", "Fail"
    return total, grade, remark

